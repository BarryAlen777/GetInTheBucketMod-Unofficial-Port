plugins { id 'java'; id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = project.mod_version
group = 'vladaviedov.getinthebucketmod'
base { archivesName = 'getinthebucketmod' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: project.minecraft_version }
dependencies { minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}" }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    def props = [mod_id: 'gitbm', mod_name: 'Get in the Bucket Mod', mod_version: project.mod_version,
                 minecraft_version: project.minecraft_version, forge_version: project.forge_version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') { expand props }
}
jar { from('LICENSE') }
jar.finalizedBy('reobfJar')
