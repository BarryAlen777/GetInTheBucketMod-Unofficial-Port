modLoader="javafml"
loaderVersion="[47,)"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
displayURL="https://github.com/BarryAlen777/GetInTheBucketMod-Unofficial-Port"
authors="BarryAlen777 (unofficial port), Vladyslav Aviedov (original author)"
description='''
Mod that allows you to put mobs into buckets.

Unofficial port of "Get in the Bucket!" by Vladyslav Aviedov, maintained by BarryAlen777.
Source: https://github.com/BarryAlen777/GetInTheBucketMod-Unofficial-Port
'''

# Forge
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

# Minecraft
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1]"
    ordering="NONE"
    side="BOTH"
